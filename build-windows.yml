name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "QQ关键词自动回复" main.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: QQ关键词自动回复-Windows
          path: dist/QQ关键词自动回复.exe
